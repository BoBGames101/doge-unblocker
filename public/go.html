<!DOCTYPE html>
<html>
<head>
    <title>Google Docs</title>
    <!-- These scripts are the "engine" of the proxy -->
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
</head>
<body style="margin:0; padding:0; overflow:hidden; background: #000;">
    <iframe id="iframeId" style="position: fixed; inset: 0px; outline: none; border: none; height: 100%; width: 100%; overflow: hidden;"></iframe>
    
    <script>
        window.onload = function() {
            const target = "https://minnit.chat";
            
            // This loop waits for the proxy engine to wake up before loading the link
            const checkConfig = setInterval(() => {
                if (window.__uv$config) {
                    clearInterval(checkConfig);
                    const encodedUrl = __uv$config.encodeUrl(target);
                    document.querySelector("#iframeId").src = "/service/" + encodedUrl;
                }
            }, 100);
        };
    </script>
</body>
</html>
